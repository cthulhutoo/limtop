[package]
name = "aitop"
version = "0.2.0"
edition = "2021"
description = "btop for AI usage — a TUI dashboard for LLM tokens, costs, and rate-limit windows across CLI coding agents"
license = "MIT"
repository = "https://github.com/cthulhutoo/aitop"
keywords = ["tui", "dashboard", "llm", "ai", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"
dirs = "5"
ureq = { version = "2", features = ["json"] }

[profile.release]
lto = true
strip = true
